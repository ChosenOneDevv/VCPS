name: VCPS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-and-simulated:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: adapters/claude-code/lib/requirements.txt
      - name: Install pinned helper dependencies
        run: python -m pip install -r adapters/claude-code/lib/requirements.txt
      - name: Run all structural and simulated suites
        run: python evaluation/run_all.py --report "$RUNNER_TEMP/vcps-validation-run.json"
      - name: Upload revision-bound validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcps-validation-${{ github.sha }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/vcps-validation-run.json
          if-no-files-found: warn
          retention-days: 90
